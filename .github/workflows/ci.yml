name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Python syntax (panel + deploy)
        run: python -m py_compile panel/*.py deploy/*.py
      - name: Shell syntax (auto_ssh.sh)
        run: sh -n router/auto_ssh.sh
      - name: Unit tests
        run: python -m pytest tests -q
